# SolarEdge & Tesla Solar Charging Optimizer
# Ultra-minimalist autonomous solar self-consumption system

solaredge:
  host: "192.168.40.169"
  port: 1502
  unit_id: 1
  timeout: 5

vehicle:
  # 100% Free Vehicle Options:
  # - fleet: Official Tesla Developer Fleet API (Free tier with $16/mo developer credits)
  # - ble: Local Bluetooth Low Energy via tesla-control (100% offline, zero cloud, zero API accounts)
  # - homeassistant: Local LAN connection to Home Assistant (controls vehicle onboard charger directly)
  # - simulator: Local mock Model 3 for instant testing without a real vehicle
  provider: "fleet"

  fleet:
    client_id: ""
    client_secret: ""
    access_token: ""
    refresh_token: ""
    domain: "srivats728.github.io"
    region: "na"

  ble:
    vin: ""
    key_file: "private-key.pem"
    binary_path: "tesla-control"

  homeassistant:
    url: "http://homeassistant.local:8123"
    token: ""
    soc_entity: "sensor.battery_sensor"
    amps_entity: "number.charging_amps"
    switch_entity: "switch.charger"

charging:
  voltage: 120
  min_amps: 5
  max_amps: 12
  start_threshold_watts: 1700
  baseline_house_watts: 600
  stop_threshold_watts: 1100
  start_delay_seconds: 120
  stop_delay_seconds: 180
  amp_change_cooldown_seconds: 45
  poll_interval_seconds: 30

whatsapp:
  enabled: false
  provider: "callmebot"
  callmebot:
    phone: "+1xxxxxxxxxx"
    apikey: "YOUR_CALLMEBOT_API_KEY"

logging:
  level: "INFO"
  file: "solaredge_tesla.log"
