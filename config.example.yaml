# SolarEdge & Tesla Solar Charging Optimizer
# Ultra-minimalist autonomous solar self-consumption system

solaredge:
  host: "192.168.40.169"
  port: 1502
  unit_id: 1
  timeout: 5

vehicle:
  # Provider options:
  # - tessie: Recommended for personal Teslas. Single API key from dash.tessie.com (no developer setup needed)
  # - homeassistant: Local LAN connection to Home Assistant instance
  # - fleet: Official Tesla Developer Fleet API
  # - simulator: Local mock Model 3 for instant testing without a real vehicle
  provider: "tessie"

  tessie:
    api_key: ""
    vin: ""

  homeassistant:
    url: "http://homeassistant.local:8123"
    token: ""
    soc_entity: "sensor.battery_sensor"
    amps_entity: "number.charging_amps"
    switch_entity: "switch.charger"

  fleet:
    client_id: ""
    client_secret: ""
    access_token: ""
    refresh_token: ""
    region: "na"

charging:
  voltage: 120
  min_amps: 5
  max_amps: 12

  # Minimum solar generation (Watts) required to initiate/consider charging
  start_threshold_watts: 1700

  # Estimated baseline household consumption (Watts) subtracted from solar to determine car surplus
  baseline_house_watts: 600

  # Power threshold below which the car stops charging
  stop_threshold_watts: 1100

  # Anti-cycling & debounce timers (seconds)
  start_delay_seconds: 120
  stop_delay_seconds: 180
  amp_change_cooldown_seconds: 45
  poll_interval_seconds: 30

whatsapp:
  enabled: false
  provider: "callmebot"

  callmebot:
    phone: "+1xxxxxxxxxx"
    apikey: "YOUR_CALLMEBOT_API_KEY"

logging:
  level: "INFO"
  file: "solaredge_tesla.log"
